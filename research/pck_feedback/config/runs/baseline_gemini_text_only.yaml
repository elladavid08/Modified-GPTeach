# Baseline run: Vertex AI Gemini, text-only.
#
# This is the closest analogue to current production behavior -- the live
# /api/pck-feedback endpoint never sends board images or explicit student
# persona info to the model today (see server/server.js).

run_id: baseline_gemini_text_only

provider: vertex_gemini
model_name: gemini-2.5-flash-lite   # matches production's model choice

prompt_version: baseline_v1
include_student_info: false
include_board_images: false

generation:
  temperature: 0.7        # matches production's generationConfig
  max_output_tokens: 2000 # matches production's generationConfig
  top_p: 1.0

# Provider-specific overrides (all optional -- defaults come from env vars,
# see .env.example). Uncomment/set only if you need to override the env
# var names or provide literal values instead:
# project: your-gcp-project-id
# location: us-central1
# project_env_var: PCK_RESEARCH_VERTEX_PROJECT_ID
# location_env_var: PCK_RESEARCH_VERTEX_LOCATION
# credentials_env_var: PCK_RESEARCH_VERTEX_GOOGLE_APPLICATION_CREDENTIALS

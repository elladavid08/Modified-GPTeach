[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pck-feedback-research"
version = "0.1.0"
description = "Offline research pipeline for PCK feedback modeling and evaluation (export, dataset build, inference). Fully isolated from the production RAMBAM-sim website."
requires-python = ">=3.10"
readme = "README.md"

# Core dependencies needed for schemas, prompt building, dataset building,
# and the CLI itself. Deliberately lightweight so that fixture-based unit
# tests can run without any credentials, network access, or heavy SDKs.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

# Heavy / credentialed SDKs are optional extras. Each model/export adapter
# lazily imports its own SDK and raises a clear, actionable error if the
# extra hasn't been installed -- so `pip install -e .` (core only) is enough
# to develop, lint, and run the fixture-based test suite.
[project.optional-dependencies]
firestore = ["firebase-admin>=6.5"]
vertex = ["google-cloud-aiplatform>=1.38"]
openai = ["openai>=1.30"]
# GPU training deps for `pck-research train-sft` (LoRA SFT), meant to be
# installed only on a GPU host (e.g. the B200 cluster) -- never required for
# dataset build / inference / evaluation or the fixture-based test suite.
# vLLM (used to *serve* a trained model afterwards) is deliberately NOT
# included here -- see src/pck_feedback/training/README.md for why, and how
# to install/run it separately.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "trl>=0.10",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
    "firebase-admin>=6.5",
    "google-cloud-aiplatform>=1.38",
    "openai>=1.30",
    "torch>=2.4",
    "transformers>=4.44",
    "trl>=0.10",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pck-research = "pck_feedback.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pck_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
